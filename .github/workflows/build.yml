name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Full-Bleed Black Adaptive Icon
        run: |
          python3 -m pip install pillow numpy --break-system-packages || python3 -m pip install pillow numpy
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image
          import numpy as np
          from collections import deque

          # 1. 저장소 내 페페 이미지 먼저 읽기
          loaded_img = None
          for root, dirs, files in os.walk("."):
              if ".git" in root or "build" in root:
                  continue
              for f in files:
                  if f.lower().endswith((".jpg", ".jpeg", ".png")):
                      src_path = os.path.join(root, f)
                      print("Loading image:", src_path)
                      loaded_img = Image.open(src_path).convert("RGBA")
                      break
              if loaded_img is not None:
                  break

          # 2. 기존 mipmap 폴더 정리
          if os.path.exists("app/src/main/mipmap-xxxhdpi"):
              shutil.rmtree("app/src/main/mipmap-xxxhdpi", ignore_errors=True)
          if os.path.exists("app/src/main/res"):
              for d in os.listdir("app/src/main/res"):
                  p = os.path.join("app/src/main/res", d)
                  if d.startswith("mipmap"):
                      shutil.rmtree(p, ignore_errors=True)

          target_dir = "app/src/main/res/mipmap-xxxhdpi"
          anydpi_dir = "app/src/main/res/mipmap-anydpi-v26"
          os.makedirs(target_dir, exist_ok=True)
          os.makedirs(anydpi_dir, exist_ok=True)

          # 3. 회색 배경을 검은색으로 바꾸고 Adaptive Icon 안전 영역(가운데 66%)에 맞게 검은 여백 추가
          if loaded_img is not None:
              arr = np.array(loaded_img)
              r, g, b = arr[:,:,0].astype(int), arr[:,:,1].astype(int), arr[:,:,2].astype(int)
              bg = (np.minimum(np.minimum(r, g), b) > 195) & ((np.maximum(np.maximum(r, g), b) - np.minimum(np.minimum(r, g), b)) < 25)
              h, w = bg.shape
              vis = np.zeros((h, w), dtype=bool)
              q = deque()
              for x in range(w):
                  if bg[0, x]: q.append((0, x)); vis[0, x] = True
                  if bg[h-1, x]: q.append((h-1, x)); vis[h-1, x] = True
              for y in range(h):
                  if bg[y, 0]: q.append((y, 0)); vis[y, 0] = True
                  if bg[y, w-1]: q.append((y, w-1)); vis[y, w-1] = True
              while q:
                  cy, cx = q.popleft()
                  for dy, dx in ((-1,0),(1,0),(0,-1),(0,1)):
                      ny, nx = cy+dy, cx+dx
                      if 0 <= ny < h and 0 <= nx < w and not vis[ny, nx] and bg[ny, nx]:
                          vis[ny, nx] = True
                          q.append((ny, nx))
              arr[vis, 0] = 0
              arr[vis, 1] = 0
              arr[vis, 2] = 0
              arr[vis, 3] = 255
              clean_pepe = Image.fromarray(arr).convert("RGBA")

              # Adaptive Icon용 432x432 캔버스(완전 검정) 중앙에 280x280 크기로 페페 배치 (테두리 잘림 및 흰 여백 완전 방지)
              canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 255))
              resized = clean_pepe.resize((280, 280), Image.LANCZOS)
              canvas.paste(resized, ((432 - 280) // 2, (432 - 280) // 2), resized)
              canvas.convert("RGB").save(os.path.join(target_dir, "ic_launcher_fg.png"))
              clean_pepe.resize((192, 192), Image.LANCZOS).convert("RGB").save(os.path.join(target_dir, "ic_launcher.png"))
          else:
              Image.new("RGB", (432, 432), (0, 0, 0)).save(os.path.join(target_dir, "ic_launcher_fg.png"))
              Image.new("RGB", (192, 192), (0, 0, 0)).save(os.path.join(target_dir, "ic_launcher.png"))

          # 4. 갤럭시 홈 화면에서 흰 테두리 없이 29CM처럼 꽉 찬 검은 배경이 나오는 Adaptive Icon XML 자동 생성
          xml_content = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@mipmap/ic_launcher_fg" />
          </adaptive-icon>
          """.strip()
          with open(os.path.join(anydpi_dir, "ic_launcher.xml"), "w") as f:
              f.write(xml_content)
          with open(os.path.join(anydpi_dir, "ic_launcher_round.xml"), "w") as f:
              f.write(xml_content)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trackpad-battery-apk
          path: app/build/outputs/apk/debug/app-debug.apk
