name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Black Background Icon
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install pillow numpy --break-system-packages || python3 -m pip install pillow numpy
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image
          import numpy as np
          from collections import deque

          # 1. 저장소 전체에서 업로드된 이미지 파일(.jpg, .jpeg, .png) 찾기
          img_candidates = []
          for root, dirs, files in os.walk("."):
              if ".git" in root or "build" in root:
                  continue
              for f in files:
                  if f.lower().endswith((".jpg", ".jpeg", ".png")):
                      img_candidates.append(os.path.join(root, f))

          # 2. 기존 res/mipmap* 및 잘못 만들어진 app/src/main/mipmap* 폴더 깨끗하게 초기화
          if os.path.exists("app/src/main/mipmap-xxxhdpi"):
              shutil.rmtree("app/src/main/mipmap-xxxhdpi", ignore_errors=True)
          if os.path.exists("app/src/main/res"):
              for d in os.listdir("app/src/main/res"):
                  p = os.path.join("app/src/main/res", d)
                  if d.startswith("mipmap"):
                      shutil.rmtree(p, ignore_errors=True)

          target_dir = "app/src/main/res/mipmap-xxxhdpi"
          os.makedirs(target_dir, exist_ok=True)
          out_path = os.path.join(target_dir, "ic_launcher.png")

          if img_candidates:
              src_img = img_candidates[0]
              print("Found image:", src_img)
              img = Image.open(src_img).convert("RGBA")
              arr = np.array(img)
              r, g, b = arr[:,:,0].astype(int), arr[:,:,1].astype(int), arr[:,:,2].astype(int)
              bg = (np.minimum(np.minimum(r, g), b) > 195) & ((np.maximum(np.maximum(r, g), b) - np.minimum(np.minimum(r, g), b)) < 25)
              h, w = bg.shape
              vis = np.zeros((h, w), dtype=bool)
              q = deque()
              for x in range(w):
                  if bg[0, x]: q.append((0, x)); vis[0, x] = True
                  if bg[h-1, x]: q.append((h-1, x)); vis[h-1, x] = True
              for y in range(h):
                  if bg[y, 0]: q.append((y, 0)); vis[y, 0] = True
                  if bg[y, w-1]: q.append((y, w-1)); vis[y, w-1] = True
              while q:
                  cy, cx = q.popleft()
                  for dy, dx in ((-1,0),(1,0),(0,-1),(0,1)):
                      ny, nx = cy+dy, cx+dx
                      if 0 <= ny < h and 0 <= nx < w and not vis[ny, nx] and bg[ny, nx]:
                          vis[ny, nx] = True
                          q.append((ny, nx))
              arr[vis, 0] = 0
              arr[vis, 1] = 0
              arr[vis, 2] = 0
              arr[vis, 3] = 255
              Image.fromarray(arr).convert("RGB").save(out_path)
          else:
              # 만약 이미지를 못 찾았더라도 빌드가 절대 실패하지 않게 기본 검은 아이콘 생성
              print("No image found, creating fallback icon")
              Image.new("RGB", (512, 512), (0, 0, 0)).save(out_path)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trackpad-battery-apk
          path: app/build/outputs/apk/debug/app-debug.apk
